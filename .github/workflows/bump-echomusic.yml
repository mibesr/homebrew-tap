name: Bump echomusic

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release tag (incl. prerelease)
        id: rel
        run: |
          TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/hoowhoami/EchoMusic/releases?per_page=20" \
            | jq -r '[.[] | select(.draft==false)][0].tag_name' \
            | sed 's/^v//')
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest: $TAG"

      - name: Update cask version
        run: |
          FILE=Casks/echomusic.rb
          NEW="${{ steps.rel.outputs.version }}"
          [ -z "$NEW" ] && exit 1
          CUR=$(grep -E '^\s*version\s+"' "$FILE" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$CUR" = "$NEW" ]; then
            echo "Already up to date: $CUR"
            exit 0
          fi
          sed -i -E "s/version \"[^\"]+\"/version \"$NEW\"/" "$FILE"
          echo "Updated: $CUR -> $NEW"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/echomusic.rb
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: bump echomusic to ${{ steps.rel.outputs.version }}"
          git push
